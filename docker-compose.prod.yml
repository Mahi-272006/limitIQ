version: "3.9"

services:
  api:
    environment:
      - DATABASE_URL=sqlite:///./limitiq.db
      - SECRET_KEY=${SECRET_KEY}
      - API_PASSWORD=${API_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
